name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate semantic version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use semantic version format vMAJOR.MINOR.PATCH."
            exit 1
          fi
      - name: Verify tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libx11-6 libice6 libsm6 libfontconfig1
      - name: Build and test
        run: mise run test
      - name: Desktop startup smoke
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: mise exec -- dotnet run --project src/DuneEdit.Desktop/DuneEdit.Desktop.csproj --no-build -- --smoke-test
      - name: Desktop startup smoke (Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: mise exec -- xvfb-run --auto-servernum dotnet run --project src/DuneEdit.Desktop/DuneEdit.Desktop.csproj --no-build -- --smoke-test

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libx11-6 libice6 libsm6 libfontconfig1
      - name: Publish desktop
        run: >-
          mise exec -- dotnet publish src/DuneEdit.Desktop/DuneEdit.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}/desktop
          -p:DebugType=None
          -p:DebugSymbols=false
      - name: Exercise self-contained desktop artifact (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = Join-Path $env:RUNNER_TEMP "no-dotnet"
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          & ".\artifacts\${{ matrix.rid }}\desktop\DuneEdit.Desktop.exe" "--artifact-compatibility-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise self-contained desktop artifact (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: >-
          env DOTNET_ROOT="$RUNNER_TEMP/no-dotnet" DOTNET_MULTILEVEL_LOOKUP=0
          "./artifacts/${{ matrix.rid }}/desktop/DuneEdit.Desktop"
          --artifact-compatibility-smoke
      - name: Exercise self-contained desktop artifact (Linux/Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: >-
          xvfb-run --auto-servernum
          env DOTNET_ROOT="$RUNNER_TEMP/no-dotnet" DOTNET_MULTILEVEL_LOOKUP=0
          "./artifacts/${{ matrix.rid }}/desktop/DuneEdit.Desktop"
          --artifact-compatibility-smoke
      - name: Package release archive (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive `
            -Path "artifacts/${{ matrix.rid }}/desktop" `
            -DestinationPath "release-assets/DuneEdit-${{ github.ref_name }}-${{ matrix.rid }}.zip"
      - name: Package release archive (macOS and Linux)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/DuneEdit-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" \
            -C "artifacts/${{ matrix.rid }}" desktop
      - uses: actions/upload-artifact@v4
        with:
          name: DuneEdit-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-release-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Dune Editor $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
