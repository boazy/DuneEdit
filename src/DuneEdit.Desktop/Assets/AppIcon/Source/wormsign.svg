<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DuneEdit — Wormsign</title>
  <desc id="desc">A top-down graphic of a sandworm maw breaking concentric desert ripples over a subtle map grid.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101C43"/>
      <stop offset="1" stop-color="#315E82"/>
    </linearGradient>
    <radialGradient id="sand" cx="0.42" cy="0.37" r="0.8">
      <stop offset="0" stop-color="#FFF1A8"/>
      <stop offset="0.5" stop-color="#E8B44B"/>
      <stop offset="1" stop-color="#A64E24"/>
    </radialGradient>
    <linearGradient id="lip" x1="0.15" y1="0.1" x2="0.86" y2="0.9">
