<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DuneEdit — Rising Maw</title>
  <desc id="desc">A constant-diameter segmented sandworm rises from a golden dune, its three-jawed mouth opening toward the viewer in three-quarter view.</desc>
